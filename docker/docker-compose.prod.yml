# ------------------------------------------------------------------------------------------------
# Production override. Use together with the base file, never on its own:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the base (development) compose:
#   * cryptex-api runs a pre-built image from your registry instead of building from source
#   * LibreChat gets the secrets it refuses to start sensibly without
#   * Swagger stays off (the base file's Development environment turns it on)
# ------------------------------------------------------------------------------------------------

# NOTE ON PORTS: Compose *appends* `ports` entries across files instead of replacing them, so an
# override here cannot narrow or remove a binding made in the base file. All loopback bindings
# therefore live in docker-compose.yml, where they are the default for every environment.

services:
  cryptex-api:
    # Set by the deploy pipeline to <registry>/cryptex-api:<buildId>.
    image: ${CRYPTEX_IMAGE:?CRYPTEX_IMAGE must be set - e.g. myregistry.azurecr.io/cryptex-api:1234}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Swagger is Development-only, so it stays off here. That is deliberate: the admin surface
      # should not be self-documenting on a production host.

  librechat:
    # LibreChat needs these or it will not run correctly; generate each with `openssl rand -hex 32`
    # (CREDS_IV is 16 bytes: `openssl rand -hex 16`). Keep them in the same secret store as the
    # Cryptex keys.
    environment:
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?set LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?set LIBRECHAT_JWT_REFRESH_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?set LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?set LIBRECHAT_CREDS_IV}
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION:-false}
